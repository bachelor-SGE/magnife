<!DOCTYPE html>
<html>
<head>
    <title>Rock Climber</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #6080b0, #4a6b9a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .slot-image {
            width: 200px;
            height: 150px;
            background: #1b2030;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #6080b0;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .slot-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .slot-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="slot-image">
        <div class="slot-icon">🧗</div>
        <div class="slot-title">Rock Climber</div>
    </div>
</body>
</html>
